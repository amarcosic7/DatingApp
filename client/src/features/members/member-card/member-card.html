@if (member(); as member) {
<div
  routerLink="/members/{{ member.id }}"
  class="group card relative cursor-pointer overflow-hidden rounded-lg shadow-md transition-all duration-300 ease-in-out hover:-translate-y-2 hover:shadow-xl"
>
  <img
    [src]="member.imageUrl || '/user.png'"
    [alt]="member.displayName + ' image'"
    class="aspect-3/4 w-full object-cover transition-transform duration-500 ease-in-out group-hover:scale-105"
  />

  @if (isOnline()) {
    <span
      title="Online"
      class="status status-success status-xl ring-base-100 absolute top-3 left-3 z-20 ring-2"
    ></span>
  }

  <button
    type="button"
    (click)="toggleLike($event)"
    aria-label="Toggle like"
    class="btn btn-ghost btn-circle text-white transition-transform duration-150 hover:bg-black/50 active:scale-90 absolute top-2 right-2 z-20 bg-black/30"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      [attr.fill]="hasLiked() ? 'currentColor' : 'none'"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="size-6 transition-colors"
      [class.text-red-500]="hasLiked()"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
      />
    </svg>
  </button>

  <div
    class="card-actions bg-linear-to-t z-10 absolute bottom-0 w-full from-black/90 via-black/60 to-transparent px-3.5 py-2.5"
  >
    <div class="flex flex-col text-white">
      <span class="text-base font-bold leading-tight">
        {{ member.displayName }}, {{ member.dateOfBirth | age }}
      </span>
      <span class="text-xs text-gray-200">{{ member.city }}</span>
    </div>
  </div>
</div>
}
